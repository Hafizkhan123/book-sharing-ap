<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book — BookShare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="page-header">

        <a href="index.html" class="back">
            ← Back
        </a>

        <h2>
            ➕ Add Book
        </h2>

    </div>


    <!-- =====================================================
         ADD BOOK FORM
    ====================================================== -->

    <div class="card">

        <div class="card-title">
            📗 Book Details
        </div>


        <div class="two-col">

            <!-- Book Title -->

            <div class="form-group">

                <label>
                    Book Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="e.g. One Piece Vol. 1"
                >

            </div>


            <!-- Author -->

            <div class="form-group">

                <label>
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="e.g. Eiichiro Oda"
                >

            </div>


            <!-- Book Cover -->

            <div class="form-group">

                <label>
                    Book Cover
                </label>

                <input
                    type="file"
                    id="bookFile"
                    accept="image/*"
                >

                <small>
                    Select a book cover image (JPG, PNG, etc.)
                </small>

            </div>

        </div>


        <!-- Owner User ID -->

        <div class="form-group">

            <label>
                Owner User ID
            </label>

            <input
                type="number"
                id="userId"
                placeholder="e.g. 1"
            >

            <small>
                The user ID of the person adding this book
            </small>

        </div>


        <!-- Add Button -->

        <button
            class="btn btn-success"
            onclick="addBook()"
        >
            Add Book
        </button>


        <!-- Loading Spinner -->

        <div
            class="spinner"
            id="spinner"
        ></div>


        <!-- Alert -->

        <div
            class="alert"
            id="alert"
        ></div>

    </div>


    <!-- =====================================================
         BOOK ADDED RESULT
    ====================================================== -->

    <div
        class="result-card"
        id="result-card"
        style="display:none"
    >

        <h3>
            ✓ Book Added Successfully
        </h3>


        <table>

            <tr>
                <th>
                    Book ID
                </th>

                <td id="res-id">
                    -
                </td>
            </tr>


            <tr>
                <th>
                    Title
                </th>

                <td id="res-title">
                    -
                </td>
            </tr>


            <tr>
                <th>
                    Author
                </th>

                <td id="res-author">
                    -
                </td>
            </tr>


            <tr>
                <th>
                    Owner
                </th>

                <td id="res-owner">
                    -
                </td>
            </tr>

        </table>

    </div>


    <!-- =====================================================
         ALL BOOKS
    ====================================================== -->

    <div class="card">

        <div class="section-title">

            <span>
                All Books
            </span>


            <button
                class="btn btn-ghost btn-sm"
                onclick="loadAllBooks()"
            >
                ↻ Refresh
            </button>

        </div>


        <!-- =================================================
             SEARCH BAR
        ================================================== -->

        <div
            style="
                margin: 15px 0;
            "
        >

            <input
                type="text"
                id="bookSearch"
                placeholder="🔍 Search by book title or author..."
                oninput="filterBooks()"
                style="
                    width: 100%;
                    padding: 12px 15px;
                    border-radius: 10px;
                    border: 1px solid #2a3045;
                    background: #1e2535;
                    color: #e8ecf4;
                    font-size: 14px;
                    outline: none;
                    box-sizing: border-box;
                "
            >

        </div>


        <!-- =================================================
             BOOK TABLE
        ================================================== -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Cover
                        </th>

                        <th>
                            ID
                        </th>

                        <th>
                            Title
                        </th>

                        <th>
                            Author
                        </th>

                        <th>
                            Owner
                        </th>

                    </tr>

                </thead>


                <tbody id="books-tbody">

                    <tr class="empty-row">

                        <td colspan="5">
                            Loading books...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/auth-guard.js"></script>

<script src="js/app.js"></script>


<script>

    // Load books automatically when page opens
    loadAllBooks();

</script>


</body>

</html>
