<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book — BookShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <a href="index.html" class="back">← Back</a>
        <h2>➕ Add Book</h2>
    </div>
    <div class="card">
        <div class="card-title">📗 Book Details</div>
        <div class="two-col">
            <div class="form-group">
                <label>Book Title</label>
                <input type="text" id="title" placeholder="e.g. One Piece Vol. 1">
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" id="author" placeholder="e.g. Eiichiro Oda">
            </div>
        </div>
        <div class="form-group">
            <label>Owner User ID</label>
            <input type="number" id="userId" placeholder="e.g. 1">
            <small>The user ID of the person adding this book</small>
        </div>
        <button class="btn btn-success" onclick="addBook()">Add Book</button>
        <div class="spinner" id="spinner"></div>
        <div class="alert" id="alert"></div>
    </div>
    <div class="result-card" id="result-card" style="display:none">
        <h3>✓ Book Added Successfully</h3>
        <table>
            <tr><th>Book ID</th><td id="res-id">-</td></tr>
            <tr><th>Title</th><td id="res-title">-</td></tr>
            <tr><th>Author</th><td id="res-author">-</td></tr>
            <tr><th>Owner</th><td id="res-owner">-</td></tr>
        </table>
    </div>
    <div class="card">
        <div class="section-title">
            All Books
            <button class="btn btn-ghost btn-sm" onclick="loadAllBooks()">↻ Refresh</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>ID</th><th>Title</th><th>Author</th><th>Owner</th></tr>
                </thead>
                <tbody id="books-tbody">
                    <tr class="empty-row"><td colspan="4">Click Refresh to load books</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/auth-guard.js"></script>
<script src="js/app.js"></script>
<script>loadAllBooks();</script>
</body>
</html>
