<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BookShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535;
            --border: #2a3045; --accent: #4f8ef7;
            --green: #22c55e; --red: #ef4444;
            --text: #e8ecf4; --text2: #8892a4; --text3: #4a5568;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
        .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand .icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
            border-radius: 16px; font-size: 1.7rem; margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(79,142,247,0.3);
        }
        .brand h1 {
            font-family: 'Syne', sans-serif; font-size: 1.75rem;
            background: linear-gradient(135deg, #e8ecf4, #4f8ef7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .brand p { color: var(--text2); font-size: 0.87rem; margin-top: 5px; font-weight: 300; }
        .card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 20px; padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card h2 { font-family: 'Syne', sans-serif; font-size: 1.15rem; margin-bottom: 22px; }
        .fg { margin-bottom: 15px; }
        .fg label {
            display: block; font-size: 0.76rem; font-weight: 500;
            color: var(--text2); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .fg input {
            width: 100%; padding: 11px 13px;
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-family: 'DM Sans', sans-serif; font-size: 0.93rem; outline: none; transition: all 0.2s;
        }
        .fg input::placeholder { color: var(--text3); }
        .fg input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,142,247,0.12); }
        .btn-login {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
            color: white; border: none; border-radius: 10px;
            font-family: 'DM Sans', sans-serif; font-size: 0.93rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; margin-top: 6px;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(79,142,247,0.35); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 18px 0; color: var(--text3); font-size: 0.78rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .btn-reg {
            width: 100%; padding: 10px; background: transparent;
            color: var(--text2); border: 1px solid var(--border);
            border-radius: 10px; font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .btn-reg:hover { color: var(--text); border-color: var(--accent); background: rgba(79,142,247,0.07); }
        .alert {
            padding: 10px 14px; border-radius: 8px; font-size: 0.84rem;
            display: none; align-items: center; gap: 8px;
            margin-bottom: 14px; border: 1px solid transparent;
        }
        .alert.show { display: flex; }
        .alert-error   { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.3);  color: #f87171; }
        .alert-success { background: rgba(34,197,94,0.1);  border-color: rgba(34,197,94,0.3);  color: #4ade80; }
        .spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite; margin: 10px auto 0;
        }
        .spinner.show { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .foot { text-align: center; margin-top: 18px; color: var(--text3); font-size: 0.76rem; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="icon">📚</div>
        <h1>BookShare</h1>
        <p>Share books. Build community.</p>
    </div>
    <div class="card">
        <h2>Welcome back 👋</h2>
        <div class="alert" id="alert"></div>
        <div class="fg">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')login()">
        </div>
        <div class="fg">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
        </div>
        <button class="btn-login" id="loginBtn" onclick="login()">Sign In</button>
        <div class="spinner" id="spinner"></div>
        <div class="divider">or</div>
        <button class="btn-reg" onclick="window.location.href='register.html'">Create New Account</button>
    </div>
    <p class="foot">BookShare &copy; 2025</p>
</div>
<script>
    fetch('/auth/status').then(r=>r.json()).then(d=>{if(d.loggedIn)window.location.href='index.html';}).catch(()=>{});

    async function login() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const alertEl  = document.getElementById('alert');
        const btn      = document.getElementById('loginBtn');
        alertEl.className = 'alert';
        if (!email||!password) { alertEl.textContent='⚠ Please enter email and password.'; alertEl.className='alert alert-error show'; return; }
        btn.disabled = true;
        document.getElementById('spinner').className = 'spinner show';
        try {
            const fd = new URLSearchParams();
            fd.append('username', email);
            fd.append('password', password);
            const res  = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:fd });
            const data = await res.json();
            if (res.ok && data.success) {
                alertEl.textContent = '✓ Login successful!';
                alertEl.className = 'alert alert-success show';
                setTimeout(() => window.location.href = 'index.html', 700);
            } else {
                alertEl.textContent = '✕ ' + (data.error || 'Invalid email or password.');
                alertEl.className = 'alert alert-error show';
            }
        } catch(e) {
            alertEl.textContent = '✕ Could not connect to server.';
            alertEl.className = 'alert alert-error show';
        } finally {
            btn.disabled = false;
            document.getElementById('spinner').className = 'spinner';
        }
    }
</script>
</body>
</html>
