<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share History — BookShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <a href="index.html" class="back">← Back</a>
        <h2>📋 Sharing History</h2>
    </div>
    <div class="card">
        <div class="card-title">🔍 Filter Records</div>
        <div class="two-col">
            <div class="form-group">
                <label>User ID (optional)</label>
                <input type="number" id="filterUserId" placeholder="Leave empty for all records">
            </div>
            <div class="form-group">
                <label>Direction</label>
                <select id="filterDirection">
                    <option value="all">All Records</option>
                    <option value="to">Books Received</option>
                    <option value="from">Books Shared Out</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary" onclick="loadHistory()">Load History</button>
        <div class="alert" id="alert" style="margin-top:14px;"></div>
    </div>
    <div class="card">
        <div class="section-title">
            Results
            <span class="count-pill" id="record-count">0 records</span>
        </div>
        <div class="spinner" id="spinner"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>ID</th><th>Book</th><th>From</th><th>To</th><th>Shared</th><th>Returned</th><th>Status</th></tr>
                </thead>
                <tbody id="history-tbody">
                    <tr class="empty-row"><td colspan="7">Click "Load History" to view records</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/auth-guard.js"></script>
<script src="js/app.js"></script>
<script>loadHistory();</script>
</body>
</html>
