<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowed Books — BookShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <a href="index.html" class="back">← Back</a>
        <h2>📖 Borrowed Books</h2>
    </div>
    <div class="card">
        <div class="card-title">👤 Look Up Borrowed Books</div>
        <div class="form-group">
            <label>User ID</label>
            <input type="number" id="userId" placeholder="Enter user ID to look up">
            <small>Shows all books currently borrowed by this user (status = SHARED)</small>
        </div>
        <button class="btn btn-primary" onclick="loadBorrowed()">Load Borrowed Books</button>
        <div class="alert" id="alert" style="margin-top:14px;"></div>
    </div>
    <div class="card">
        <div class="section-title">
            <span id="borrowed-title">Borrowed Books</span>
            <span class="count-pill" id="borrowed-count">0 books</span>
        </div>
        <div class="spinner" id="spinner"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>ID</th><th>Title</th><th>Author</th><th>Shared By</th><th>Since</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="borrowed-tbody">
                    <tr class="empty-row"><td colspan="7">Enter a user ID and click Load</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/auth-guard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
