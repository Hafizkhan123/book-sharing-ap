<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Book — BookShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <a href="index.html" class="back">← Back</a>
        <h2>↩️ Return Book</h2>
    </div>
    <div class="card">
        <div class="card-title">📥 Return by Share ID</div>
        <div class="form-group">
            <label>Sharing Record ID</label>
            <input type="number" id="shareId" placeholder="e.g. 1">
            <small>Find the Share ID from Sharing History or Borrowed Books page</small>
        </div>
        <button class="btn btn-danger" onclick="returnBook()">Mark as Returned</button>
        <div class="spinner" id="spinner"></div>
        <div class="alert" id="alert"></div>
    </div>
    <div class="result-card" id="result-card" style="display:none">
        <h3>✓ Book Returned Successfully</h3>
        <table>
            <tr><th>Share ID</th><td id="res-id">-</td></tr>
            <tr><th>Book</th><td id="res-book">-</td></tr>
            <tr><th>From</th><td id="res-from">-</td></tr>
            <tr><th>To</th><td id="res-to">-</td></tr>
            <tr><th>Shared On</th><td id="res-share-date">-</td></tr>
            <tr><th>Returned On</th><td id="res-return-date">-</td></tr>
            <tr><th>Status</th><td id="res-status">-</td></tr>
        </table>
    </div>
    <div class="card">
        <div class="section-title">
            Active Borrows
            <div style="display:flex;gap:8px;align-items:center;">
                <input type="number" id="borrowUserId" placeholder="Filter by User ID"
                    style="padding:5px 10px;background:#1e2535;border:1px solid #2a3045;
                           border-radius:8px;color:#e8ecf4;font-size:0.82rem;width:160px;outline:none;">
                <button class="btn btn-ghost btn-sm" onclick="loadActiveShares()">Load</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>ID</th><th>Book</th><th>From</th><th>To</th><th>Date</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="active-tbody">
                    <tr class="empty-row"><td colspan="7">Click Load to view active borrows</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="js/auth-guard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
